name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm headless browser
        run: |
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version

      # Use the exact candidate until DEM 2.0.0 is published to npm.
      - name: Check out DEM candidate
        uses: actions/checkout@v4
        with:
          repository: teqfw/dem
          ref: f8b504aaa9487b001689a3d6dae82a2d1c403eeb
          path: .dem-release-source

      - name: Install dependencies with DEM candidate
        run: |
          npm pack ./.dem-release-source --pack-destination "$RUNNER_TEMP"
          npm install --ignore-scripts --no-save "$RUNNER_TEMP/teqfw-dem-2.0.0.tgz"

      - name: Run unit, type and real-browser verification
        run: npm run verify

      - name: Check package contents
        run: npm pack --dry-run
